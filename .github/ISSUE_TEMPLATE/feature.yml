name: Feature request
description: Propose a focused improvement to VPN Balance Bot.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem needs solving?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe expected behavior, not only an implementation detail.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Telegram user experience
        - Administration
        - Billing and ledger
        - Reminders
        - SQLite and backups
        - Deployment and operations
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I checked existing issues and documentation for this proposal.
          required: true
        - label: The proposal does not contain credentials, private data, or security vulnerability details.
          required: true
