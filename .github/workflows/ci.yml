name: Go CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@db41740e12847bb616a339b75eb9414e711417df # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@403833af8e5981a13ba72a4e90025743050557ca # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Build application
        run: go build ./cmd/vpn-balance-bot
